<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    background: linear-gradient(170deg, #1a1035 0%, #0f0f1a 40%, #1a0a2e 100%);
    position: relative;
  }
  body::before {
    content: '';
    position: absolute;
    top: -10%;
    right: -20%;
    width: 70%;
    height: 50%;
    background: radial-gradient(ellipse, rgba(245,158,11,0.15) 0%, transparent 65%);
    pointer-events: none;
  }
  .text-area {
    position: absolute;
    top: 7%;
    left: 0;
    right: 0;
    text-align: center;
    padding: 0 6%;
    z-index: 2;
  }
  h1 {
    font-size: 11.5vw;
    font-weight: 800;
    color: white;
    line-height: 1.05;
    margin-bottom: 2.5vh;
    letter-spacing: -0.03em;
  }
  h1 span {
    background: linear-gradient(135deg, #fbbf24, #f59e0b, #f97316);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  p {
    font-size: 5vw;
    font-weight: 400;
    color: rgba(255,255,255,0.7);
    line-height: 1.3;
  }
  .device-area {
    position: absolute;
    bottom: 2%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1;
  }
  .device-area img {
    width: 72vw;
    height: auto;
    filter: drop-shadow(0 40px 80px rgba(0,0,0,0.6));
  }
</style>
</head>
<body>
  <div class="text-area">
    <h1 data-kou-id="headline" data-kou-role="headline"><span>{{headline_accent}}</span> {{headline_rest}}<br>{{headline_tail}}</h1>
    <p data-kou-id="subtitle" data-kou-role="subheadline">{{subtitle}}</p>
  </div>
  <div class="device-area">
    <img data-kou-id="device" data-kou-role="device" src="{{app_screenshot}}">
  </div>
</body>
</html>
